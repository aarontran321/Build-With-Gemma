<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>flow</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(900px 500px at 80% 15%, #13203a 0%, rgba(19,32,58,0) 55%),
      #0b0f1a;
    color: #dfe7f3;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; position: relative;
  }
  .title { position: absolute; top: 36px; left: 0; right: 0; text-align: center;
           font-size: 22px; font-weight: 800; letter-spacing: .16em;
           color: #8fa3bd; }
  .title b { color: #5eead4; }
  .step {
    width: 780px; text-align: center; padding: 18px 26px;
    background: #111827; border: 1.5px solid #2b3a52; border-radius: 14px;
    font-size: 27px; font-weight: 650; color: #e2e8f0;
  }
  .step b { color: #5eead4; }
  .step.gemma { border-color: #2dd4bf; background: #0e2b26; }
  .step.rail  { border-color: #f87171; background: #200a0c; }
  .arrow { color: #5eead4; font-size: 26px; line-height: .9; font-weight: 700; }
  .foot { position: absolute; bottom: 30px; left: 0; right: 0; text-align: center;
          font-size: 16px; color: #64748b; letter-spacing: .04em; }
</style>
</head>
<body>
  <div class="title">JANUS <b>// SENSOR ARBITER</b> — HOW A CONFLICT FLOWS</div>

  <div class="step">iPhone sensors detect anomalies <span style="color:#8fa3bd">(rotation, free fall, impact)</span></div>
  <div class="arrow">▼</div>
  <div class="step gemma"><b>Gemma</b> interprets the evidence and proposes a response</div>
  <div class="arrow">▼</div>
  <div class="step rail"><b style="color:#fca5a5">Guardrail</b> validates it</div>
  <div class="arrow">▼</div>
  <div class="step">Dashboard shows the decision</div>

  <div class="foot">edge-deployed · fully offline · LLM proposes, code disposes</div>
</body>
</html>
